name: Update Daily Market Data

on:
  schedule:
    # UTC Mon-Fri becomes HKT Tue-Sat. Keep 05:30 and retry separately;
    # GitHub scheduled events can be delayed or dropped under high load.
    - cron: '30 21 * * 1-5'
    - cron: '17 22,23 * * 1-5'
    - cron: '17 0 * * 2-6'
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'generate_data.py'
      - 'requirements.txt'
      - 'docs/index.html'
      - 'docs/dashboard.js'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/update_dashboard.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: market-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      refresh: ${{ steps.freshness.outputs.refresh }}
      source_sha: ${{ steps.freshness.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A delayed scheduled event may refer to an older snapshot commit.
          # Serialize production runs, then inspect the current main branch.
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test market calculations and missing-data handling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test dashboard rendering and data integrity
        run: |
          node --check docs/dashboard.js
          node --test tests/dashboard.test.cjs
      - name: Check whether this session still needs recovery
        id: freshness
        env:
          PAGES_URL: https://marcusjai.github.io/GitHub-Actions-Daily-Trigger/
        run: |
          python -m scripts.snapshot_health --github-output
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  scrape-and-deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.refresh == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout validated production source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Real Data Scraper Engine
        run: python generate_data.py
      - name: Reject stale or inconsistent market snapshots
        run: python -m scripts.snapshot_health --require-current
      - name: Commit and push validated data.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          if git diff --cached --quiet; then
            echo 'No snapshot change; no commit needed.'
          else
            git commit -m "Update daily market snapshot: $(date -u +%FT%TZ)"
            git push origin HEAD:main
          fi
          echo "Published source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Request Pages build and verify published snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Bot pushes do not automatically trigger a branch-based Pages build.
          # Request a build explicitly; do not change the user's Pages settings.
          pages_url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url')
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          python scripts/verify_pages.py "$pages_url"
