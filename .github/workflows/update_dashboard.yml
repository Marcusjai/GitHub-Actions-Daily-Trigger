name: Update Daily 100% Real Market Data

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install yfinance pandas requests beautifulsoup4

      - name: Run Real Data Scraper Engine
        run: python generate_data.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          git commit -m "Auto-update 100% real market & ChartExchange data: $(date -u)" || exit 0
          git push
