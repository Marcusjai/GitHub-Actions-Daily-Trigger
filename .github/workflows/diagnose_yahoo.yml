name: Diagnose Yahoo source observations
on:
  push:
    branches: [fix/yahoo-session-recovery-20260922]
    paths: ['.github/workflows/diagnose_yahoo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-recovery-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch real observations into an uncommitted test snapshot
        run: python generate_data.py
      - name: Validate the real snapshot against the existing dashboard
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const dashboard=require('./docs/dashboard.js');
          const payload=dashboard.normalizePayload(JSON.parse(fs.readFileSync('docs/data.json','utf8')));
          console.log(JSON.stringify({market_date:payload.market_date,last_updated:payload.last_updated,indices:payload.indices.length,sectors:payload.sectors.length,missing_off_exchange:payload.missing_off_exchange,recoveries:payload.history_validation.closing_quote_recoveries},null,2));
          JS
