name: Live-test Yahoo interior-gap recovery
on:
  push:
    branches: ['fix/yahoo-interior-gap-recovery-20260924']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-recovery-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate a real snapshot without publishing it
        run: |
          mkdir -p /tmp/dashboard-live-test
          cp docs/data.json /tmp/dashboard-live-test/data.json
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.yahoo_history import completed_sessions
          import generate_data

          path=Path('/tmp/dashboard-live-test/data.json')
          before=json.loads(path.read_text(encoding='utf-8'))
          result=generate_data.generate_real_market_json(path)
          expected=str(completed_sessions()[-1].date())
          assert result['market_date']==expected, (result['market_date'], expected)
          assert len(result['indices'])==4 and len(result['sectors'])==10
          rows=result['indices']+result['sectors']
          assert len(rows)==14
          assert all(row['market_date']==expected for row in rows)
          assert all(isinstance(row.get('volume'), int) and row['volume']>=0 for row in rows)
          assert all(isinstance(row.get('rvol'), (int,float)) for row in rows)
          validation=result.get('history_validation',{})
          assert validation.get('missing_required_observations')==0
          recoveries=validation.get('historical_recoveries',[])
          for rec in recoveries:
              assert rec['volume_min'] <= rec['volume_max']
              assert rec['intraday_corroboration']['consensus']=='query1_query2_exact'
              assert rec['intraday_corroboration']['regular_volume_lower_bound'] <= rec['volume_max']
          print('LIVE_OK', json.dumps({
              'previous_market_date':before.get('market_date'),
              'market_date':result['market_date'],
              'historical_recoveries':[(r['ticker'],r['market_date'],r['volume_min'],r['volume_max']) for r in recoveries],
              'latest_quote_recoveries':[r['ticker'] for r in validation.get('closing_quote_recoveries',[])],
              'missing_off_exchange':result.get('missing_off_exchange',[]),
          }))
          PY
      - name: Validate generated snapshot with dashboard parser
        run: |
          node - <<'JS'
          const fs=require('fs');
          const d=require('./docs/dashboard.js');
          const p=JSON.parse(fs.readFileSync('/tmp/dashboard-live-test/data.json','utf8'));
          const n=d.normalizePayload(p);
          if(n.indices.length!==4 || n.sectors.length!==10) throw new Error('dashboard row count mismatch');
          console.log('DASHBOARD_OK',n.market_date,n.missing_off_exchange.length);
          JS
