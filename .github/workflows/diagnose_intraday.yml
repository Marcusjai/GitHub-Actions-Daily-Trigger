name: Live Yahoo recovery verification
on:
  push:
    branches: ['fix/yahoo-interior-gap-recovery-20260924']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --check docs/dashboard.js
          node --test tests/dashboard.test.cjs
      - name: Generate live snapshot without publishing
        run: python generate_data.py
      - name: Verify live snapshot integrity
        run: |
          python - <<'PY'
          import json, math
          import pandas as pd
          from scripts.yahoo_history import completed_sessions
          p=json.load(open('docs/data.json',encoding='utf-8'))
          expected=str(completed_sessions()[-1].date())
          rows=p.get('indices',[])+p.get('sectors',[])
          assert p.get('market_date')==expected,(p.get('market_date'),expected)
          assert len(p.get('indices',[]))==4 and len(p.get('sectors',[]))==10
          assert len(rows)==14 and len({r['ticker'] for r in rows})==14
          for r in rows:
              assert r.get('market_date')==expected
              for k in ('price','return','alpha','rvol'):
                  v=r.get(k); assert isinstance(v,(int,float)) and not isinstance(v,bool) and math.isfinite(v),(r.get('ticker'),k,v)
              assert r['price']>0 and r['rvol']>=0
              assert isinstance(r.get('volume'),int) and r['volume']>=0
          v=p.get('history_validation',{})
          assert v.get('expected_market_date')==expected
          assert v.get('missing_required_observations')==0
          print('LIVE_OK',expected,'rows',len(rows),'recovered',v.get('recovered_tickers',[]),'historical',len(v.get('historical_recoveries',[])))
          PY
