name: Diagnose Yahoo interior daily gap
on:
  push:
    branches: ['fix/yahoo-interior-gap-recovery-20260924']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pandas exchange_calendars curl_cffi
      - name: Inspect Sep 22 daily adjustment basis and intraday cross-check
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          import exchange_calendars as xcals
          from curl_cffi import requests
          snap=json.load(open('docs/data.json',encoding='utf-8'))
          rows={r['ticker']:r for r in snap['indices']+snap['sectors']}
          cal=xcals.get_calendar('XNYS',start='2026-09-21',end='2026-09-24')
          d=pd.Timestamp('2026-09-22'); o=cal.session_open(d); c=cal.session_close(d)
          for symbol in ['DIA','URA','XLU','XLK','XLI','XBI','XLV','XLP']:
              url=f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}'
              with requests.Session(impersonate='chrome') as s:
                  daily=s.get(url,params={'range':'3mo','interval':'1d','includeAdjustedClose':'true','events':'div,splits'},timeout=20,allow_redirects=False)
                  daily.raise_for_status(); result=daily.json()['chart']['result'][0]
                  q=result['indicators']['quote'][0]; adj=result['indicators']['adjclose'][0]['adjclose']; ts=result['timestamp']
                  print('\nSYMBOL',symbol,'SNAPSHOT',rows[symbol]['price'],'PRICE_SOURCE',rows[symbol].get('priceSource'))
                  print('EVENTS',json.dumps(result.get('events',{}),sort_keys=True))
                  for i,t in enumerate(ts):
                      date=pd.Timestamp(t,unit='s',tz='UTC').tz_convert('America/New_York').date().isoformat()
                      if date in {'2026-09-21','2026-09-22','2026-09-23'}:
                          print('DAILY',date,'raw_close',q['close'][i],'adj',adj[i],
                                'open',q['open'][i],'high',q['high'][i],'low',q['low'][i],'volume',q['volume'][i])
                  intra=s.get(url,params={'period1':int((o-pd.Timedelta(minutes=2)).timestamp()),
                                          'period2':int((c+pd.Timedelta(minutes=2)).timestamp()),
                                          'interval':'1m','includePrePost':'false','events':'div,splits'},timeout=20,allow_redirects=False)
                  intra.raise_for_status(); ir=intra.json()['chart']['result'][0]; iq=ir['indicators']['quote'][0]
                  points=[]
                  for i,t in enumerate(ir.get('timestamp',[])):
                      stamp=pd.Timestamp(t,unit='s',tz='UTC')
                      if o <= stamp < c:
                          points.append((stamp,iq['close'][i],iq['volume'][i]))
                  print('INTRADAY_LAST',points[-1] if points else None,'SESSION',o.isoformat(),c.isoformat())
          PY
