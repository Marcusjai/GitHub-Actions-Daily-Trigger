name: Diagnose alternate daily volume sources
on:
  push:
    branches: ['fix/yahoo-interior-gap-recovery-20260924']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Compare Nasdaq and Stooq daily rows for Sep 22
        run: |
          python - <<'PY'
          import json, requests
          snap=json.load(open('docs/data.json',encoding='utf-8'))
          rows={r['ticker']:r for r in snap['indices']+snap['sectors']}
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                   'Accept':'application/json,text/plain,*/*','Referer':'https://www.nasdaq.com/'}
          for symbol in ['DIA','URA','XLU','XLK','XLI','XBI','XLV','XLP']:
              print('\nSYMBOL',symbol,'SNAPSHOT_PRICE',rows[symbol]['price'])
              try:
                  url=f'https://api.nasdaq.com/api/quote/{symbol}/historical'
                  r=requests.get(url,params={'assetclass':'etf','fromdate':'09/22/2026','todate':'09/22/2026','limit':10},headers=headers,timeout=20)
                  print('NASDAQ HTTP',r.status_code)
                  if r.ok:
                      obj=r.json(); print('NASDAQ',json.dumps(obj.get('data',{}).get('tradesTable',{}).get('rows',[]),ensure_ascii=False))
                  else: print('NASDAQ BODY',r.text[:300])
              except Exception as e: print('NASDAQ ERROR',type(e).__name__,e)
              try:
                  url=f'https://stooq.com/q/d/l/?s={symbol.lower()}.us&d1=20260922&d2=20260922&i=d'
                  r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=20)
                  print('STOOQ HTTP',r.status_code,'BODY',repr(r.text[:300]))
              except Exception as e: print('STOOQ ERROR',type(e).__name__,e)
          PY
