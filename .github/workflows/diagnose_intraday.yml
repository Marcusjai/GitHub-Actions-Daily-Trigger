name: Diagnose Yahoo volume endpoints
on:
  push:
    branches: ['fix/yahoo-interior-gap-recovery-20260924']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pandas exchange_calendars curl_cffi yfinance
      - name: Compare intraday aggregation volumes
        run: |
          python - <<'PY'
          import json, pandas as pd, exchange_calendars as xcals
          from curl_cffi import requests
          cal=xcals.get_calendar('XNYS',start='2026-09-21',end='2026-09-24')
          d=pd.Timestamp('2026-09-22'); o=cal.session_open(d); c=cal.session_close(d)
          for symbol in ['DIA','URA','XLU','XLK','XLI','XBI','XLV','XLP']:
            print('\nSYMBOL',symbol)
            for interval in ['1m','2m','5m','15m','30m','60m','90m','1d']:
              url=f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}'
              params={'period1':int((o-pd.Timedelta(minutes=2)).timestamp()),
                      'period2':int((c+pd.Timedelta(minutes=2)).timestamp()),
                      'interval':interval,'includePrePost':'false','events':'div,splits'}
              try:
                with requests.Session(impersonate='chrome') as s:
                  r=s.get(url,params=params,timeout=20,allow_redirects=False); r.raise_for_status()
                  result=r.json()['chart']['result'][0]; ts=result.get('timestamp',[]); q=result['indicators']['quote'][0]
                  vals=[]
                  for i,t in enumerate(ts):
                    stamp=pd.Timestamp(t,unit='s',tz='UTC')
                    if o <= stamp < c:
                      vals.append((stamp,q['close'][i],q['volume'][i]))
                  total=sum(v or 0 for _,_,v in vals)
                  print(interval,'bars',len(vals),'sumvol',total,'last',vals[-1] if vals else None)
              except Exception as e:
                print(interval,'ERROR',type(e).__name__,e)
          PY
